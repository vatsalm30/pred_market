# Builds the site and deploys it to Cloudflare Workers.
# Market data lives on the `data` branch (one commit, replaced by the GCP pipeline each run);
# the pipeline sends a `data-updated` dispatch when it publishes, and code changes under web/
# deploy on push. The schedule is a fallback in case a dispatch is missed.
name: Deploy web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-web.yml"]
  repository_dispatch:
    types: [data-updated]
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Use the latest market data
        working-directory: .
        run: web/scripts/pull-data.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # npm ci fails here: a lockfile made on macOS omits some Linux-only optional deps
      - run: npm install --no-audit --no-fund
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
